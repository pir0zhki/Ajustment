<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>日程調整ツール</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="app-header">
    <div class="app-header-inner">
      <a class="logo" href="./">📅 日程調整ツール</a>
    </div>
  </header>

  <main class="container">
    <div id="demo-banner" class="notice" hidden>
      <strong>デモモードで動作中：</strong>データはこのブラウザ内（localStorage）にだけ保存され、他の人とは共有されません。
      <code>js/firebase-config.js</code> を設定すると共有できるようになります。
    </div>

    <form id="create-form" class="card" novalidate>
      <h1 class="page-title">新しいイベントを作成</h1>

      <div class="field">
        <label for="title">イベント名<span class="req">*</span></label>
        <input id="title" class="input" type="text" maxlength="100" placeholder="例）第2回チームリーダー懇親会" required>
      </div>

      <div class="field">
        <label for="creator">作成者</label>
        <input id="creator" class="input" type="text" maxlength="50" placeholder="例）片岡">
      </div>

      <div class="field">
        <label for="description">説明（任意）</label>
        <textarea id="description" class="textarea" maxlength="1000" placeholder="場所や持ち物など"></textarea>
      </div>

      <div class="field">
        <span class="label">候補日<span class="req">*</span></span>
        <p class="small">日付をクリックして選択します。曜日の見出しをクリックすると、その月の同じ曜日をまとめて選択・解除できます。</p>
        <div id="calendar" class="cal"></div>
        <div class="chips-head">
          <span id="date-count" class="small">0日選択中</span>
          <button id="clear-dates" type="button" class="link-btn">すべて解除</button>
        </div>
        <div id="date-chips" class="date-chips"></div>
      </div>

      <div class="field">
        <span class="label">時間帯（1時間単位）</span>
        <div class="time-row">
          <select id="start-hour" class="select" aria-label="開始時刻"></select>
          <span>〜</span>
          <select id="end-hour" class="select" aria-label="終了時刻"></select>
        </div>
      </div>

      <button id="create-btn" type="submit" class="btn btn-primary btn-block">イベントを作成して共有URLを発行</button>
    </form>

    <section id="recent" class="card" hidden>
      <h2 class="card-title">この端末で最近開いたイベント</h2>
      <ul id="recent-list" class="recent-list"></ul>
    </section>
  </main>

  <footer class="footer">日程調整ツール</footer>

  <script type="module" src="js/create.js"></script>
</body>
</html>
